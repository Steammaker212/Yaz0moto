name: Build Artifacts

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_type:
        required: true
        type: string

jobs:

  # ──────────────────────────────────────────────────────────────
  # Windows x64
  # ──────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: x64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Add LLVM to PATH
        shell: pwsh
        run: |
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: pip install Cython==3.2.4 "PyQt5==5.15.11" "requests==2.32.3" SarcLib==0.3 "cx_Freeze==8.4.1"

      - name: Inject metadata
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          $d = Get-Content project.json | ConvertFrom-Json
          $d | Add-Member -NotePropertyName release_type -NotePropertyValue ${{ inputs.release_type }} -Force
          $d | Add-Member -NotePropertyName version -NotePropertyValue $v -Force
          $d | Add-Member -NotePropertyName build_date -NotePropertyValue ((Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")) -Force
          $d | ConvertTo-Json | Set-Content project.json

      - name: Build
        id: build
        continue-on-error: true
        run: python build.py build_ext --inplace build_exe

      - name: Retry build (cx_Freeze winversioninfo is inconsistent)
        if: steps.build.outcome == 'failure'
        run: python build.py build_ext --inplace build_exe

      # Yaz0moto installs its updates with this program; a package without it can't update
      - name: Check the updater runs
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          & ".\distrib\miyamoto_v$v\updater\Yaz0moto-Updater.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package as zip
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          7z a -mx=9 -tzip "Yaz0moto-v$v-Windows-x64.zip" ".\distrib\miyamoto_v$v\*"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: Yaz0moto-*.zip
          retention-days: 7


  # ──────────────────────────────────────────────────────────────
  # macOS Universal
  # ──────────────────────────────────────────────────────────────
  build-macos:
    name: macOS Universal
    # Intel: the build makes a universal app on either kind of runner (see below), and the
    # Apple Silicon ones are short ("Due to capacity constraints, jobs targeting macOS arm64
    # runners may experience longer queue times", jobs not acquired by a runner at all).
    # macos-14 is retired.
    runs-on: macos-15-intel
    env:
      # Developer ID signing and notarization, used when these secrets are set (see
      # docs/RELEASING.md). Without them the app is ad-hoc signed, and macOS asks users to
      # confirm opening it the first time.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      NOTARIZE: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.APPLE_ID != '' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # python.org's universal2 Python (setup-python only has one architecture or the other):
      # the app takes Python, its standard library and every extension built with it from
      # here, so they all run natively on Intel and Apple Silicon Macs
      - name: Install Python 3.9 (universal2, python.org)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python.pkg" https://www.python.org/ftp/python/3.9.13/python-3.9.13-macos11.pkg
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.9/bin/python3.9
          lipo -archs "$PY"
          lipo -archs "$PY" | grep -q x86_64 && lipo -archs "$PY" | grep -q arm64
          "$PY" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - run: |
          python -m pip install "pip==24.3.1"
          python -m pip install Cython==3.2.4 "PyQt5==5.15.11" "requests==2.32.3" SarcLib==0.3 "cx_Freeze==8.4.1"

      - name: Inject metadata
        run: |
          python3 -c "import json,sys; d=json.load(open('project.json')); import datetime; d['release_type']=sys.argv[1]; d['version']=sys.argv[2]; d['build_date']=datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'); open('project.json','w').write(json.dumps(d,indent=4))" \
            "${{ inputs.release_type }}" "${{ inputs.version }}"

      - name: Build universal Cython extensions + .app
        env:
          ARCHFLAGS: "-arch x86_64 -arch arm64"
        run: python build.py build_ext --inplace bdist_mac

      # PyQt5 and Qt only publish wheels for one architecture at a time, and pip installed
      # this runner's. Their other half comes from the other architecture's wheels; then every
      # binary in the app must have both, or it would only run on one kind of Mac.
      - name: Make every binary universal
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            PLATFORMS="--platform macosx_10_9_x86_64 --platform macosx_10_13_x86_64 --platform macosx_11_0_x86_64"
          else
            PLATFORMS="--platform macosx_11_0_arm64 --platform macosx_12_0_arm64"
          fi
          PLATFORMS="$PLATFORMS --platform macosx_10_9_universal2 --platform macosx_11_0_universal2"
          PACKAGES="$(python buildtools/make_universal.py packages)"
          echo "Packages installed for $(uname -m) only: ${PACKAGES:-none}"
          mkdir -p other-wheels other-site
          if [ -n "$PACKAGES" ]; then
            python -m pip download --no-deps --only-binary=:all: --python-version 3.9 \
              --implementation cp --abi cp39 --abi abi3 --abi none $PLATFORMS -d other-wheels $PACKAGES
            for w in other-wheels/*.whl; do python -m zipfile -e "$w" other-site; done
          fi
          python buildtools/make_universal.py merge build/Yaz0moto.app other-site

      # bdist_mac keeps everything but the executable in Contents/Resources, with
      # relative symlinks to its folders in Contents/MacOS. That layout must stay:
      # files in Contents/MacOS count as code, and codesign stores the signature of
      # a non-code file there (XML, images...) in extended attributes, which zip
      # drops, so the downloaded app would no longer be signed.
      - name: Remove hidden folders from the bundle
        run: |
          python - <<'EOF'
          import os, shutil
          res_dir = 'build/Yaz0moto.app/Contents/Resources'
          # The app never reads these (e.g. the example patch's .github folder). Only our
          # own data folders are cleaned: libraries can keep real code in hidden folders (.dylibs).
          for data_dir in ('yaz0data', 'yaz0extras'):
              for root, dirs, files in os.walk(os.path.join(res_dir, data_dir)):
                  for d in [d for d in dirs if d.startswith('.')]:
                      shutil.rmtree(os.path.join(root, d))
                      print(f'>> Removed hidden folder: {os.path.join(root, d)}')
                      dirs.remove(d)
          EOF

      # Signing must be the last change to the bundle: anything moved inside it
      # afterwards breaks the signature, and macOS then calls the app damaged.
      - name: Sign bundle
        run: |
          if [ "$NOTARIZE" = "true" ]; then
            # Developer ID: the certificate goes in a keychain of its own for this job
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
              -A -t cert -f pkcs12 -k "$KEYCHAIN"
            rm -f "$RUNNER_TEMP/certificate.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
            if [ -z "$IDENTITY" ]; then
              echo "::error::MACOS_CERTIFICATE has no 'Developer ID Application' identity"
              exit 1
            fi
            echo "Signing with: $IDENTITY"
            # Notarization needs the hardened runtime and a secure timestamp on everything
            SIGN=(--options runtime --timestamp --entitlements buildtools/macos-entitlements.plist --sign "$IDENTITY")
          else
            echo "No Developer ID secrets: ad-hoc signing (macOS asks users to confirm opening it once)"
            SIGN=(--sign -)
          fi
          # Libraries and helpers live in Contents/Resources, where codesign --deep doesn't
          # sign them, and the build changed them (install names, merged architectures).
          # macOS won't load a library whose signature is broken, so sign each one first.
          find build/Yaz0moto.app/Contents/Resources -type f -print0 |
            while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q 'Mach-O'; then
                codesign --force "${SIGN[@]}" "$f"
              fi
            done
          codesign --force --deep "${SIGN[@]}" build/Yaz0moto.app
          codesign --verify --deep --strict --verbose=2 build/Yaz0moto.app

      # Apple checks the signed app and issues a ticket, stapled to the app so Gatekeeper
      # accepts it without asking, even offline. Stapling doesn't change the signature.
      - name: Notarize
        if: env.NOTARIZE == 'true'
        run: |
          ditto -c -k --keepParent build/Yaz0moto.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 45m --output-format json > notary.json || true
          cat notary.json
          STATUS="$(python3 -c "import json; print(json.load(open('notary.json')).get('status', ''))" 2>/dev/null || true)"
          if [ "$STATUS" != "Accepted" ]; then
            ID="$(python3 -c "import json; print(json.load(open('notary.json')).get('id', ''))" 2>/dev/null || true)"
            if [ -n "$ID" ]; then
              xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" || true
            fi
            echo "::error::Notarization was not accepted (status: ${STATUS:-none})"
            exit 1
          fi
          xcrun stapler staple build/Yaz0moto.app
          xcrun stapler validate build/Yaz0moto.app

      # -y stores the bundle's symlinks as symlinks. Without it zip copies what they
      # point to, which changes the signed bundle and breaks its signature.
      - name: Package macOS-universal.zip
        run: |
          V="${{ inputs.version }}"
          cd build && zip -r -y -9 -X "../Yaz0moto-v${V}-macOS-universal.zip" Yaz0moto.app

      - name: Check the zip unpacks to a correctly signed universal app
        run: |
          V="${{ inputs.version }}"
          CHECK=$(mktemp -d)
          ditto -x -k "Yaz0moto-v${V}-macOS-universal.zip" "$CHECK"
          codesign --verify --deep --strict --verbose=2 "$CHECK/Yaz0moto.app"
          INFO=$(lipo -info "$CHECK/Yaz0moto.app/Contents/MacOS/Yaz0moto")
          echo "$INFO"
          echo "$INFO" | grep -q x86_64
          echo "$INFO" | grep -q arm64
          echo "Symlinks kept in the bundle: $(find "$CHECK/Yaz0moto.app" -type l | wc -l)"

          # What Gatekeeper will say to people who download it
          if [ "$NOTARIZE" = "true" ]; then
            spctl --assess --type execute --verbose=2 "$CHECK/Yaz0moto.app"
            xcrun stapler validate "$CHECK/Yaz0moto.app"
          else
            echo "::notice::macOS build is ad-hoc signed, not notarized: Gatekeeper asks users to confirm opening it the first time. Add the Developer ID secrets (docs/RELEASING.md) to notarize it."
          fi

          # The updater (signed above with the rest of the bundle) must run on its own
          UPDATER="$CHECK/Yaz0moto.app/Contents/Resources/updater/Yaz0moto-Updater"
          lipo -info "$UPDATER"
          lipo -archs "$UPDATER" | grep -q x86_64 && lipo -archs "$UPDATER" | grep -q arm64
          "$UPDATER" version

          # It must also start: macOS kills it at launch if a library's signature is
          # broken, and a missing module stops it too. A fresh HOME gives it no settings,
          # so it opens the first-run setup and waits there.
          export HOME="$(mktemp -d)"
          "$CHECK/Yaz0moto.app/Contents/MacOS/Yaz0moto" > launch.log 2>&1 &
          PID=$!
          sleep 20
          if ! kill -0 "$PID" 2>/dev/null; then
            CODE=0; wait "$PID" || CODE=$?
            cat launch.log
            echo "::error::The app quit at launch (exit code $CODE)"
            exit 1
          fi
          kill "$PID"
          echo "The app started and was still running after 20 seconds."

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Yaz0moto-*-macOS-universal.zip
          retention-days: 7


  # ──────────────────────────────────────────────────────────────
  # Linux x86_64 AppImage + updater zip
  # ──────────────────────────────────────────────────────────────
  build-linux-x86_64:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libxcb1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libgl1-mesa-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - run: pip install Cython==3.2.4 "PyQt5==5.15.11" "requests==2.32.3" SarcLib==0.3 "cx_Freeze==8.4.1"

      - name: Inject metadata
        run: |
          python3 -c "import json,sys; d=json.load(open('project.json')); import datetime; d['release_type']=sys.argv[1]; d['version']=sys.argv[2]; d['build_date']=datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'); open('project.json','w').write(json.dumps(d,indent=4))" \
            "${{ inputs.release_type }}" "${{ inputs.version }}"

      - name: Build
        run: python build.py build_ext --inplace build_exe

      - name: Check the updater runs
        run: distrib/miyamoto_v${{ inputs.version }}/updater/Yaz0moto-Updater version

      - name: Assemble AppDir
        run: |
          V="${{ inputs.version }}"
          APPDIR="AppDir"
          mkdir -p "${APPDIR}"
          cp -r "distrib/miyamoto_v${V}/." "${APPDIR}/"
          cp buildtools/Yaz0moto.desktop "${APPDIR}/Yaz0moto.desktop"
          cp yaz0data/app_icons/yaz0moto1024.png "${APPDIR}/Yaz0moto.png"
          cp buildtools/AppRun           "${APPDIR}/AppRun"
          chmod +x "${APPDIR}/AppRun" "${APPDIR}/Yaz0moto"

      - name: Download appimagetool
        run: |
          wget -q -O appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          V="${{ inputs.version }}"
          APPIMAGE_EXTRACT_AND_RUN=1 \
          ARCH=x86_64 \
            ./appimagetool --no-appstream AppDir \
            "Yaz0moto-v${V}-Linux-x86_64.AppImage"

      - name: Package updater zip
        run: |
          V="${{ inputs.version }}"
          cd "distrib/miyamoto_v${V}" && zip -r -9 -X "../../Yaz0moto-v${V}-Linux-x86_64.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-appimage
          path: |
            Yaz0moto-*.AppImage
            Yaz0moto-*-Linux-x86_64.zip
          retention-days: 7
