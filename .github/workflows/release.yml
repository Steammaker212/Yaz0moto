name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.1)'
        required: true

jobs:

  # ──────────────────────────────────────────────────────────────
  # Preflight
  # ──────────────────────────────────────────────────────────────
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      # The build writes this version into project.json, and the updater compares it
      # numerically, so anything but X.Y.Z would publish a release users never get.
      - name: Check the version format
        run: |
          if ! echo "${{ steps.ver.outputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'${{ steps.ver.outputs.version }}' is not a version like 1.2.3 (tags must look like v1.2.3)."
            exit 1
          fi

      - name: Verify critical imports and entry points
        run: |
          python - <<'EOF'
          import sys, os
          errors = []
          try:
              from miyamoto.globals import MiyamotoVersion
              print(f"  OK  miyamoto.globals  ->  v{MiyamotoVersion}")
          except Exception as e:
              errors.append(f"miyamoto.globals import failed: {e}")
          if not os.path.isfile("yaz0moto.py"):
              errors.append("yaz0moto.py entry point is missing")
          else:
              print("  OK  yaz0moto.py exists")
          with open("build.py") as f:
              src = f.read()
          if "from globals import" in src:
              errors.append("build.py still uses 'from globals import'")
          else:
              print("  OK  build.py import path is correct")
          import re
          match = re.search(r"Executable\(\s*['\"](.+?)['\"]", src)
          if match:
              ep = match.group(1)
              if not os.path.isfile(ep):
                  errors.append(f"build.py Executable points to '{ep}' which does not exist")
              else:
                  print(f"  OK  Executable entry point '{ep}' exists")
          if not os.path.isfile("project.json"):
              errors.append("project.json is missing")
          else:
              print("  OK  project.json exists")
          if errors:
              print("\nPREFLIGHT FAILED:")
              for e in errors:
                  print(f"  X  {e}")
              sys.exit(1)
          print("\nAll preflight checks passed.")
          EOF

  # ──────────────────────────────────────────────────────────────
  # Build all platform artifacts (reusable workflow)
  # ──────────────────────────────────────────────────────────────
  build:
    needs: preflight
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      release_type: release
    secrets: inherit

  # ──────────────────────────────────────────────────────────────
  # Publish Release
  # ──────────────────────────────────────────────────────────────
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: >-
      always() && !cancelled() &&
      needs.build.result == 'success'
    needs:
      - preflight
      - build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Collect release files
        run: |
          mkdir release_files
          find _artifacts -type f \( -name "*.zip" -o -name "*.AppImage" \) \
            -exec cp {} release_files/ \;
          echo "--- Release files ---"
          ls -lh release_files/

      - name: Build release body
        run: |
          V="${{ needs.preflight.outputs.version }}"
          {
            echo "| Platform | File |"
            echo "|---|---|"
            for f in release_files/*-macOS-*.zip; do
              [ -f "$f" ] && echo "| macOS Universal | \`$(basename "$f")\` |"
            done
            for f in release_files/*-Windows-*.zip; do
              [ -f "$f" ] && echo "| Windows x64 | \`$(basename "$f")\` |"
            done
            for f in release_files/*-Linux-x86_64*.AppImage; do
              [ -f "$f" ] && echo "| Linux x86_64 | \`$(basename "$f")\` |"
            done
            for f in release_files/*-Linux-x86_64*.zip; do
              [ -f "$f" ] && echo "| Linux x86_64 (zip) | \`$(basename "$f")\` |"
            done
          } > release_body.md
          cat release_body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          name: v${{ needs.preflight.outputs.version }}
          draft: true
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body_path: release_body.md
          files: release_files/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.preflight.outputs.version }}" --draft=false
