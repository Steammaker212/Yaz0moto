name: Tests

# Quick checks that run on every push to deluxe-support and on pull requests:
#   - deluxe_smoke_test.py: Deluxe levels, tilesets and the tileset editor (round trips)
#   - branding_test.py:     name/updater/build/CI consistency (the updater must never point at another project)
#   - regression_test.py:   fixes from the v1.0.0 review (paths, text, saving, update packages)
#   - studio_tools_test.py: Check Level rules and metrics, Export Mod Package, undo history, movement preview, release tags
#   - updater_test.py:      the updater program: release files, download/unpack, install, keeping user files, rollback
#   - quickpaint_test.py:   Quick Paint terrain: parts, merging, painting/erasing next to terrain, undo
#   - gametilesets_test.py: the palette's Game tab: listing every tileset, objects, packs, copying into a level
#   - make_universal_test.py: making every binary of the macOS app universal (arm64 + x86_64)

on:
  push:
    branches: [deluxe-support]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Smoke tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libxcb1 libxkbcommon-x11-0 libxkbcommon0 libdbus-1-3 libegl1 libfontconfig1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libgl1-mesa-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - run: pip install Cython==3.2.4 "PyQt5==5.15.11" "requests==2.32.3" SarcLib==0.3

      - name: Deluxe smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/deluxe_smoke_test.py

      - name: Branding and release consistency
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/branding_test.py

      - name: Level checker, mod export and undo history
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/studio_tools_test.py

      - name: Regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/regression_test.py

      - name: Updater
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/updater_test.py

      - name: Quick Paint
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/quickpaint_test.py

      - name: Game tab
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gametilesets_test.py

      - name: macOS universal app tool
        run: python tests/make_universal_test.py
