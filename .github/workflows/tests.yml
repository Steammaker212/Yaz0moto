name: Tests

# Quick checks that run on every push to main and on pull requests:
#   - deluxe_smoke_test.py: Deluxe levels, tilesets and the tileset editor (round trips)
#   - branding_test.py:     name/updater/build/CI consistency (the updater must never point at another project)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Smoke tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libxcb1 libxkbcommon-x11-0 libxkbcommon0 libdbus-1-3 libegl1 libfontconfig1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libgl1-mesa-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - run: pip install Cython==3.2.4 "PyQt5==5.15.11" "requests==2.32.3" SarcLib==0.3

      - name: Deluxe smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/deluxe_smoke_test.py

      - name: Branding and release consistency
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/branding_test.py
