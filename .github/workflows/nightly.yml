name: Nightly Build

on:
  push:
    branches: [main]
    paths:
      - 'miyamoto/**'
      - '*.py'
      - '**/*.py'
      - '**/*.pyx'
      - '**/*.c'
      - '**/*.h'
      - 'FastYZ/**'
      - 'addrlib/**'
      - 'bc3/**'
      - 'bntxlib/**'
      - 'buildtools/*.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────────────────────
  # Preflight
  # ──────────────────────────────────────────────────────────────
  preflight:
    name: Preflight checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verify critical imports and entry points
        run: |
          python - <<'EOF'
          import sys, os
          errors = []
          try:
              from miyamoto.globals import MiyamotoVersion
              print(f"  OK  miyamoto.globals  ->  v{MiyamotoVersion}")
          except Exception as e:
              errors.append(f"miyamoto.globals import failed: {e}")
          if not os.path.isfile("yaz0moto.py"):
              errors.append("yaz0moto.py entry point is missing")
          else:
              print("  OK  yaz0moto.py exists")
          with open("build.py") as f:
              src = f.read()
          if "from globals import" in src:
              errors.append("build.py still uses 'from globals import'")
          else:
              print("  OK  build.py import path is correct")
          import re
          match = re.search(r"Executable\(\s*['\"](.+?)['\"]", src)
          if match:
              ep = match.group(1)
              if not os.path.isfile(ep):
                  errors.append(f"build.py Executable points to '{ep}' which does not exist")
              else:
                  print(f"  OK  Executable entry point '{ep}' exists")
          if not os.path.isfile("project.json"):
              errors.append("project.json is missing")
          else:
              print("  OK  project.json exists")
          if errors:
              print("\nPREFLIGHT FAILED:")
              for e in errors:
                  print(f"  X  {e}")
              sys.exit(1)
          print("\nAll preflight checks passed.")
          EOF

  # ──────────────────────────────────────────────────────────────
  # Prepare build metadata
  # ──────────────────────────────────────────────────────────────
  prepare:
    name: Prepare build metadata
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      datetime: ${{ steps.meta.outputs.datetime }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Get commit metadata
        id: meta
        run: |
          COMMIT_DT=$(git log -1 --format=%cI | cut -c1-19 | sed 's/:/-/g')
          echo "datetime=$COMMIT_DT" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────
  # Build all platform artifacts (reusable workflow)
  # ──────────────────────────────────────────────────────────────
  build:
    if: github.ref == 'refs/heads/main'
    needs: [preflight, prepare]
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      release_type: nightly
    secrets: inherit

  # ──────────────────────────────────────────────────────────────
  # Publish nightly GitHub Release
  # ──────────────────────────────────────────────────────────────
  release:
    name: Publish Nightly Release
    runs-on: ubuntu-latest
    if: >-
      always() && !cancelled() &&
      needs.build.result == 'success'
    needs:
      - prepare
      - build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Collect release files
        run: |
          mkdir release_files
          find _artifacts -type f \( -name "*.zip" -o -name "*.AppImage" \) \
            -exec cp {} release_files/ \;
          echo "--- Release files ---"
          ls -lh release_files/

      - name: Build release body
        run: |
          {
            echo "Automated nightly build from [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})."
            echo ""
            echo "| Platform | File |"
            echo "|---|---|"
            for f in release_files/*-macOS-*.zip; do
              [ -f "$f" ] && echo "| macOS Universal | \`$(basename "$f")\` |"
            done
            for f in release_files/*-Windows-*.zip; do
              [ -f "$f" ] && echo "| Windows x64 | \`$(basename "$f")\` |"
            done
            for f in release_files/*-Linux-x86_64*.AppImage; do
              [ -f "$f" ] && echo "| Linux x86_64 | \`$(basename "$f")\` |"
            done
            for f in release_files/*-Linux-x86_64*.zip; do
              [ -f "$f" ] && echo "| Linux x86_64 (zip) | \`$(basename "$f")\` |"
            done
          } > release_body.md
          cat release_body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ needs.prepare.outputs.datetime }}-${{ needs.prepare.outputs.sha }}
          name: "Nightly ${{ needs.prepare.outputs.datetime }}  [${{ needs.prepare.outputs.sha }}]"
          draft: true
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body_path: release_body.md
          files: release_files/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit \
            "nightly-${{ needs.prepare.outputs.datetime }}-${{ needs.prepare.outputs.sha }}" \
            --draft=false
